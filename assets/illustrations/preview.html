<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FactorCloud Illustrations Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A08;
      display: flex;
      gap: 40px;
      padding: 60px;
      flex-wrap: wrap;
      align-items: flex-start;
      min-height: 100vh;
    }
    .item {
      text-align: center;
    }
    .item img {
      width: 160px;
      height: 160px;
      display: block;
    }
    .item p {
      color: #A89880;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      margin-top: 12px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="item">
    <img src="cloud-clearing.svg" alt="Cloud Clearing">
    <p>cloud-clearing.svg</p>
  </div>
  <div class="item">
    <img src="dual-ledger.svg" alt="Dual Ledger">
    <p>dual-ledger.svg</p>
  </div>
  <div class="item">
    <img src="automation.svg" alt="Automation">
    <p>automation.svg</p>
  </div>
  <div class="item">
    <img src="client-portal.svg" alt="Client Portal">
    <p>client-portal.svg</p>
  </div>
  <div class="item">
    <img src="integrations.svg" alt="Integrations">
    <p>integrations.svg</p>
  </div>
</body>
</html>
