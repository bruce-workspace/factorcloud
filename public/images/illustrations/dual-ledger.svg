<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Open book / ledger shape -->
  <!-- Left page -->
  <path d="M 100 48 Q 82 46 60 50 Q 40 54 38 62 L 38 148 Q 40 154 60 152 Q 82 148 100 150 Z"
        fill="#D4A843" fill-opacity="0.12" stroke="#D4A843" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M 100 48 Q 118 46 140 50 Q 160 54 162 62 L 162 148 Q 160 154 140 152 Q 118 148 100 150 Z"
        fill="#D4A843" fill-opacity="0.12" stroke="#D4A843" stroke-width="2" stroke-linejoin="round"/>

  <!-- Spine / center binding -->
  <line x1="100" y1="48" x2="100" y2="150" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left page lines (debits) -->
  <g stroke="#D4A843" stroke-width="1" stroke-linecap="round" opacity="0.9">
    <line x1="50" y1="76" x2="90" y2="74"/>
    <line x1="50" y1="90" x2="90" y2="88"/>
    <line x1="50" y1="104" x2="90" y2="102"/>
    <line x1="50" y1="118" x2="90" y2="116"/>
    <line x1="50" y1="132" x2="90" y2="130"/>
  </g>

  <!-- Right page lines (credits) -->
  <g stroke="#D4A843" stroke-width="1" stroke-linecap="round" opacity="0.9">
    <line x1="110" y1="74" x2="150" y2="76"/>
    <line x1="110" y1="88" x2="150" y2="90"/>
    <line x1="110" y1="102" x2="150" y2="104"/>
    <line x1="110" y1="116" x2="150" y2="118"/>
    <line x1="110" y1="130" x2="150" y2="132"/>
  </g>

  <!-- Balance / equals mark at bottom center -->
  <g stroke="#D4A843" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <line x1="88" y1="160" x2="112" y2="160"/>
    <line x1="88" y1="167" x2="112" y2="167"/>
  </g>

  <!-- Left page label "DR" suggestion - two small tick marks -->
  <g stroke="#C9983A" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="64" x2="62" y2="64"/>
  </g>
  <!-- Right page label "CR" suggestion -->
  <g stroke="#C9983A" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <line x1="138" y1="64" x2="150" y2="64"/>
  </g>
</svg>
