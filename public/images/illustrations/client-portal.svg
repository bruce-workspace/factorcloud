<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Monitor / laptop frame -->
  <!-- Screen bezel -->
  <rect x="30" y="38" width="140" height="98" rx="6" ry="6"
        fill="#D4A843" fill-opacity="0.08" stroke="#D4A843" stroke-width="2"/>
  <!-- Screen inner area -->
  <rect x="38" y="46" width="124" height="82" rx="2" ry="2"
        fill="#D4A843" fill-opacity="0.05" stroke="#D4A843" stroke-width="1" opacity="0.6"/>

  <!-- Monitor stand neck -->
  <rect x="93" y="136" width="14" height="18" rx="2" ry="2"
        fill="#D4A843" fill-opacity="0.15" stroke="#D4A843" stroke-width="2"/>
  <!-- Monitor stand base -->
  <path d="M 70 154 Q 100 158 130 154"
        fill="none" stroke="#D4A843" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="154" x2="130" y2="154" stroke="#D4A843" stroke-width="2" stroke-linecap="round"/>

  <!-- Dashboard UI inside screen -->
  <!-- Top bar / header suggestion -->
  <rect x="44" y="52" width="90" height="6" rx="2" ry="2"
        fill="#D4A843" fill-opacity="0.5"/>

  <!-- 3 data rows (horizontal bars) -->
  <g opacity="0.65">
    <rect x="44" y="66" width="110" height="5" rx="2" ry="2" fill="#D4A843" fill-opacity="0.4"/>
    <rect x="44" y="77" width="95" height="5" rx="2" ry="2" fill="#D4A843" fill-opacity="0.4"/>
    <rect x="44" y="88" width="105" height="5" rx="2" ry="2" fill="#D4A843" fill-opacity="0.4"/>
  </g>

  <!-- Simple bar chart (right side, lower) -->
  <g fill="#D4A843" opacity="0.8">
    <!-- 4 bars of varying heights, left to right -->
    <rect x="110" y="106" width="10" height="20" rx="1" ry="1" fill-opacity="0.7"/>
    <rect x="124" y="98" width="10" height="28" rx="1" ry="1" fill-opacity="0.8"/>
    <rect x="138" y="112" width="10" height="14" rx="1" ry="1" fill-opacity="0.6"/>
    <rect x="152" y="103" width="10" height="23" rx="1" ry="1" fill-opacity="0.75"/>
  </g>

  <!-- Chart baseline -->
  <line x1="108" y1="128" x2="164" y2="128"
        stroke="#D4A843" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Small circle indicator / status dot -->
  <circle cx="156" cy="55" r="4" fill="#D4A843" opacity="0.8"/>
  <circle cx="144" cy="55" r="4" fill="#D4A843" fill-opacity="0.3" stroke="#D4A843" stroke-width="1"/>
</svg>
